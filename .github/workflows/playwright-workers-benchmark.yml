name: Playwright worker-count pilot

# Experimental branch only: leave the existing PR/main CI gate untouched.
# Publishing this branch starts four browser jobs. Get approval before pushing.
on:
  push:
    branches: [experiment/playwright-workers]
    paths:
      - .github/workflows/playwright-workers-benchmark.yml
      - scripts/playwright-benchmark.mjs
      - scripts/lib/playwright-benchmark.mjs

permissions:
  contents: read
  actions: read

concurrency:
  group: playwright-workers-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: WebKit sample ${{ matrix.sample }} / ${{ matrix.workers }} worker(s)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: [1, 2]
        workers: [1, 2]
    env:
      BENCHMARK_SAMPLE: ${{ matrix.sample }}
      BENCHMARK_WORKERS: ${{ matrix.workers }}
      PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/benchmark/playwright.json
    steps:
      - name: Mark setup start
        run: echo "BENCHMARK_SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Install WebKit and OS dependencies
        run: npx playwright install --with-deps webkit
      - name: Production build
        run: npm run build
      - name: Run unchanged WebKit suite
        run: |
          mkdir -p benchmark
          set +e
          /usr/bin/time -v -o benchmark/resources.txt npx playwright test --project=webkit --workers="$BENCHMARK_WORKERS" --reporter=list,json 2>&1 | node scripts/playwright-benchmark.mjs redact
          statuses=("${PIPESTATUS[@]}")
          node scripts/playwright-benchmark.mjs record benchmark/playwright.json benchmark/run.json "$BENCHMARK_SAMPLE" "${statuses[0]}"
          record_status=$?
          set -e
          if (( statuses[0] != 0 )); then exit "${statuses[0]}"; fi
          if (( statuses[1] != 0 )); then exit "${statuses[1]}"; fi
          exit "$record_status"
      - name: Upload measurements and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: workers-pilot-${{ github.run_id }}-${{ github.run_attempt }}-s${{ matrix.sample }}-w${{ matrix.workers }}
          path: |
            benchmark/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  compare:
    name: Compare complete paired samples
    needs: benchmark
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: workers-pilot-${{ github.run_id }}-${{ github.run_attempt }}-s*-w*
          path: benchmark-artifacts
      - name: Compare without discarding missing or unreliable samples
        run: |
          mkdir -p benchmark-artifacts
          node scripts/playwright-benchmark.mjs compare benchmark-artifacts 2
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: workers-pilot-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark-artifacts/comparison.json
            benchmark-artifacts/comparison.md
          retention-days: 7
          if-no-files-found: warn
