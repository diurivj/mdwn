name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, migration smoke, secrets
    # This persistent runner is for trusted, same-repository changes only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # The persistent runner already keeps npm's cache locally.
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unicode namespace data drift check
        run: npm run check:namespace
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: D1 migration smoke test (fresh local D1)
        run: npm run db:smoke
      - name: Local D1 export/restore round trip
        run: npm run db:restore:local
      - name: Secret-leak check on client bundle
        run: npm run check:secrets
        env:
          MDWN_CHECK_SECRETS: ${{ secrets.MDWN_CHECK_SECRETS }} # optional: production HEALTHZ_TOKEN, comma-separated

  browser:
    name: Browser E2E (${{ matrix.browser }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Avoid uploading the runner account's entire npm cache to GitHub.
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install ${{ matrix.browser }}
        env:
          # Scope the Node/Playwright connection-timeout workaround to downloads.
          NODE_OPTIONS: --import="${{ github.workspace }}/scripts/playwright-download-network.mjs"
      - name: Browser tests (${{ matrix.browser }})
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Upload ${{ matrix.browser }} diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
