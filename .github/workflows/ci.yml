name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # setup-node saves the npm cache through the Actions cache API.
  actions: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, migration smoke, secrets
    # Same-repository changes only. Fork pull requests stay off this workflow:
    # it can read an optional repository secret, and fork code is not reviewed here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted Linux. Playwright WebKit runs here; a macOS runner is not required.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint and format check
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unicode namespace data drift check
        run: npm run check:namespace
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: D1 migration smoke test (fresh local D1)
        run: npm run db:smoke
      - name: Local D1 export/restore round trip
        run: npm run db:restore:local
      - name: Secret-leak check on client bundle
        run: npm run check:secrets
        env:
          MDWN_CHECK_SECRETS: ${{ secrets.MDWN_CHECK_SECRETS }} # optional: production HEALTHZ_TOKEN, comma-separated

  browser:
    name: Browser E2E (${{ matrix.browser }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Same hosted image as verify. WebKit is Playwright's Linux build, not Safari on macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
        env:
          # Scope the Node/Playwright connection-timeout workaround to downloads.
          NODE_OPTIONS: --import="${{ github.workspace }}/scripts/playwright-download-network.mjs"
      - name: WebKit key-storage check
        if: matrix.browser == 'webkit'
        run: node scripts/probe-ci-webkit-storage.mjs
      - name: Browser tests (${{ matrix.browser }})
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Summarize browser retries
        if: ${{ !cancelled() }}
        run: node scripts/summarize-playwright.mjs
      - name: Upload ${{ matrix.browser }} diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            playwright-results.json
            playwright-summary.json
          if-no-files-found: warn
